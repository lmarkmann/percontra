name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Publishes the GitHub release for a version tag. The body is that version's
# section of web/CHANGELOG.md, which `changeset version` wrote from the
# changesets that accumulated since the previous release.
#
# The tag is cut by `just release`, which bumps web/package.json, writes the
# changelog section, commits both, and tags with `changeset tag`. Tagging by
# hand skips that, so the first step checks the tag matches the manifest and
# the changelog carries a section for it, and fails loudly if not.
#
# No toolchain: the job reads two files and calls gh. No separate test gate
# either, since a version tag points at a commit that already went through
# `ci` on main.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Tag matches web/package.json and web/CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          MANIFEST="$(jq -r .version web/package.json)"
          if [ "${MANIFEST}" != "${VERSION}" ]; then
            echo "::error::tag ${TAG} but web/package.json says ${MANIFEST}; cut releases with 'just release', not a bare git tag"
            exit 1
          fi
          if ! grep -qxF "## ${VERSION}" web/CHANGELOG.md; then
            echo "::error::no section for ${VERSION} in web/CHANGELOG.md; cut releases with 'just release', not a bare git tag"
            exit 1
          fi
        shell: bash

      - name: Publish the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v heading="## ${VERSION}" '
            $0 == heading { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' web/CHANGELOG.md > /tmp/release-body.md
          gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/release-body.md --verify-tag
        shell: bash
