name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three independent jobs, one per deliverable: the Vite app in web/, the Django
# API in api/, and the container the two ship in. Hackathon calibration: every
# gate here catches a bug or a drift (types, lint, unit, e2e, contract, image
# build); the budget-style gates the template carried (Lighthouse thresholds,
# per-folder coverage minimums) are not run here, `pnpm perf:ci` and
# `pnpm test:coverage` stay available locally.
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # No version input: action-setup reads packageManager from web/package.json, so
      # the lockfile and CI can never disagree on the pnpm version.
      # pnpm/action-setup v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: web/package.json
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: oxfmt (format check)
        run: pnpm exec oxfmt --check .
      - name: tsc
        run: pnpm typecheck
      - name: oxlint
        run: pnpm exec oxlint --format=github
      - run: pnpm exec knip
      - run: pnpm audit --prod --audit-level high
      - name: vitest
        run: pnpm exec vitest run
      - run: pnpm build
      - run: pnpm exec size-limit
      - run: pnpm exec playwright install --with-deps chromium
      - name: playwright
        run: pnpm exec playwright test
      # The HTML report carries a screenshot of every test plus video and trace
      # of any failure; it is the artifact to open when a run goes red and the
      # one to show when it does not.
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.0.1. Pinned uv version per Astral's own guidance;
      # the cache is keyed on the lockfile so a dependency change refreshes it.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      # Reads api/.python-version.
      - run: uv python install
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github . ../scripts
      - name: ruff format
        run: uv run ruff format --check . ../scripts
      - name: pyrefly
        run: uv run pyrefly check
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing
      # The Python models and the TypeScript types are both generated from
      # contracts/*.schema.json; a hand edit to either, or a schema change
      # without regeneration, fails here. Pure Python despite emitting
      # TypeScript: this job needs no Node toolchain.
      - name: contract drift
        run: uv run python ../scripts/contracts.py --check

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The same build Cloud Run runs from `just deploy`; a Dockerfile that
      # rots is the demo-day failure this step exists to catch. Nothing is pushed.
      - run: docker build --tag percontra .
