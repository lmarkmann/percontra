name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tooling chain: oxfmt + oxlint + tsc + vitest + build.
# oxfmt --check fails on format drift; oxlint is the sole linter.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The frontend lives in web/, so every run step executes there.
    defaults:
      run:
        working-directory: web
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # No version input: action-setup reads packageManager from web/package.json, so
      # the lockfile and CI can never disagree on the pnpm version.
      # pnpm/action-setup v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: web/package.json
      # actions/setup-node v6.5.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: oxfmt (format check)
        run: pnpm exec oxfmt --check .
      - name: tsc
        run: pnpm typecheck
      - name: oxlint
        run: pnpm exec oxlint --format=github
      - run: pnpm exec knip
      - run: pnpm audit --prod --audit-level high
      - run: pnpm exec vitest run --coverage
      - run: pnpm build
      - run: pnpm exec size-limit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run perf:ci
      - run: pnpm run test:e2e
