# Orchestration only: ordering, staging, stages, and file filters live here. Every
# command delegates to `just` (the single command layer) so a hook and a human run
# exactly the same thing. See https://prek.j178.dev.

[priorities]
fmt = 0
types = 1

[[repos]]
repo = "builtin"
hooks = [
  { id = "mixed-line-ending", name = "line endings are consistent", priority = 0 },
  { id = "end-of-file-fixer", name = "files end with a newline", priority = 0 },
  { id = "check-merge-conflict", name = "no merge conflict markers", priority = 0 },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "oxfmt",
    name = "oxfmt formats code",
    entry = "just format",
    language = "system",
    priority = "fmt",
    pass_filenames = false,
    types_or = ["ts", "tsx", "javascript", "jsx", "json", "css"],
  },
  {
    # validates the prek.toml itself
    id = "validate-config",
    name = "prek.toml is valid",
    entry = "prek validate-config prek.toml",
    language = "system",
    pass_filenames = false,
    files = "^prek\\.toml$",
    priority = "types",
  },
  {
    id = "tsc",
    name = "tsc typechecks changed code",
    entry = "just typecheck",
    language = "system",
    priority = "types",
    pass_filenames = false,
    types_or = ["ts", "tsx"],
  },
  {
    id = "oxlint",
    name = "oxlint lints changed code",
    entry = "just lint",
    language = "system",
    priority = "types",
    pass_filenames = false,
    types_or = ["ts", "tsx"],
  },
  {
    # Pre-push only: a full-test run stays out of the commit path. CI still owns
    # knip/audit/size/build; vitest here is the fast red-suite guard.
    id = "vitest",
    name = "vitest (pre-push)",
    entry = "just test",
    language = "system",
    priority = "types",
    pass_filenames = false,
    types_or = ["ts", "tsx"],
    stages = ["pre-push"],
  },
]
