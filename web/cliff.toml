# git-cliff: docs/CHANGELOG.md is generated from conventional commits, one
# section per version tag. The headline after the date comes from the annotated
# tag's message, which git-cliff exposes as `message`; a lightweight tag renders
# a headline-less heading. Run through `just changelog` / `just release`, never
# by hand. See docs/adr/039-git-cliff-not-changesets.md.
#
# A release with no version renders nothing, so unreleased commits never reach
# the file: open work belongs to docs/TODO.md and the two do not overlap. To
# see what is pending, `just unreleased` supplies a version with --bump.

[changelog]
header = """
# Changelog

What shipped, newest first. Open work lives in [`TODO.md`](TODO.md) and nowhere
else, so a section here means the tag that contains it exists. Decisions are in
[`adr/`](adr/); the passes that predate `v0.0.0` are in [`synthesis/`](synthesis/).

Regenerate with `just changelog`; cut a version with `just release`. Sections are
built from conventional commits, and the sentence after each date is the first
line of that version's annotated tag message.
"""

body = """
{% if version %}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}{% if message %}: {{ message | split(pat="\\n") | first | trim }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
{%- endif %}
"""

# No provenance footer: nothing this repo emits carries a generator marker.
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
topo_order = false
sort_commits = "newest"
tag_pattern = "v[0-9]*"

commit_parsers = [
  # The release commit writes this file; it is bookkeeping, not a change.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Docs" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci|chore)", group = "<!-- 6 -->Tooling" },
  # A type no parser above claims still shows up rather than vanishing.
  { message = ".*", group = "<!-- 7 -->Other" },
]
