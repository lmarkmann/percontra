[project]
name = "percontra"
version = "0.1.0"
description = "Migration sign-off for fund accounting: decide, approve, release, compare."
requires-python = ">=3.12"
dependencies = [
	"duckdb>=1.3",
	"fastapi>=0.116",
	"openpyxl>=3.1",
	"polars[calamine]>=1.32",
	"pydantic>=2.11",
	"uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
	"httpx>=0.28",
	"pytest>=8.4",
]

[project.scripts]
percontra = "percontra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["percontra"]

[tool.pytest.ini_options]
testpaths = ["tests"]