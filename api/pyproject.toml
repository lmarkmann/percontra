[project]
name = "percontra"
version = "0.1.0"
description = "Migration sign-off for fund accounting: decide, approve, release, compare."
requires-python = ">=3.14"
dependencies = [
	"django>=6.1",
	"duckdb>=1.5",
	"fastexcel>=0.21",
	"openpyxl>=3.1",
	"polars>=1.44",
	"pyarrow>=25",
	"pydantic>=2.13",
	"uvicorn[standard]>=0.52",
	"whitenoise>=6.12",
]

[dependency-groups]
dev = [
	"pytest>=9.1",
	"pytest-django>=4.14",
]

[project.scripts]
percontra = "percontra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["percontra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "percontra.settings"