[project]
name = "percontra"
version = "0.1.0"
description = "Migration sign-off for fund accounting: decide, approve, release, compare."
requires-python = ">=3.14"
dependencies = [
	"django>=5.2",
	"duckdb>=1.3",
	"fastexcel>=0.15",
	"openpyxl>=3.1",
	"polars>=1.42",
	"pyarrow>=17",
	"pydantic>=2.11",
	"uvicorn[standard]>=0.35",
	"whitenoise>=6.9",
]

[dependency-groups]
dev = [
	"pytest>=8.4",
	"pytest-django>=4.11",
]

[project.scripts]
percontra = "percontra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["percontra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "percontra.settings"