[project]
name = "percontra"
dynamic = ["version"]
description = "Migration sign-off for fund accounting: decide, approve, release, compare."
requires-python = ">=3.14"
dependencies = [
	"django>=6.1",
	"duckdb>=1.5",
	"fastexcel>=0.21",
	"openpyxl>=3.1",
	"orjson>=3.11",
	"polars>=1.44",
	"pyarrow>=25",
	"pydantic>=2.13",
	"typer>=0.27",
	"uvicorn[standard]>=0.52",
	"whitenoise>=6.12",
]

[dependency-groups]
dev = [
	"datamodel-code-generator>=0.76.2",
	"pyrefly>=1.2.0",
	"pytest>=9.1",
	"pytest-cov>=7.1.0",
	"pytest-django>=4.14",
	"ruff>=0.16.6",
]

[project.scripts]
percontra = "percontra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["percontra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "percontra.settings"

# The version lives once, in web/package.json, where `changeset version` bumps it.
[tool.hatch.version]
path = "../web/package.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.ruff]
line-length = 100
extend-exclude = ["percontra/contract/models.py"]

[tool.ruff.lint]
# Bugs and hygiene, not style policing: pyflakes, bugbear, pyupgrade, import order,
# naming (the N family is what .claude/rules/naming-py.md relies on), ruff's own.
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "RUF"]

[tool.pyrefly]
project-includes = ["percontra", "../scripts"]
# verify_ui.py drives the built app through Playwright for Python, which is not an api
# dependency; it is run by hand with uvx --with playwright. The color scripts import a
# sibling module through sys.path and shell out to a skill's calc.py, so neither the
# import root nor the tool they measure with is resolvable from here.
project-excludes = ["../scripts/verify_ui.py", "../scripts/color"]
python-version = "3.14"

# Warnings, not errors, while the pipeline passes untyped dicts around and openpyxl
# returns Optionals everywhere: these six categories are all inference noise on this
# code today. Flip each back to "error" once the module it fires in carries real types.
[tool.pyrefly.errors]
missing-attribute = "warn"
unsupported-operation = "warn"
bad-assignment = "warn"
bad-argument-type = "warn"
bad-return = "warn"
bad-index = "warn"

[tool.coverage.run]
source = ["percontra"]
omit = ["percontra/contract/models.py", "percontra/asgi.py"]
